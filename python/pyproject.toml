[project]
name = "family-resort-watch"
version = "0.3.0"
description = "Watch Hyatt Inclusive Collection all-inclusive and flight prices for one family's trip."
license = "MIT"
requires-python = ">=3.11"
# Hotels need only the standard library. Flights use Google Flights through
# fast-flights: 3.1.0 imports typing_extensions without declaring it, and
# selectolax re-parses the payload. flights.py reads fast-flights' internals,
# so it stays pinned to the minor version it was written against.
dependencies = [
    "fast-flights>=3.1.0,<3.2",
    "typing-extensions>=4.12",
    "selectolax>=0.3.21,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
frw = "family_resort_watch.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
family_resort_watch = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
